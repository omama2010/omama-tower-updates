name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download iOS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_NAME="$(
            gh release view ios-build-source \
              --repo omama2010/omama-tower-updates \
              --json assets \
              --jq '.assets[].name' \
            | grep -E '^ios_update_[0-9]+(\.[0-9]+)*\.zip$' \
            | python3 -c '
          import sys

          files = [x.strip() for x in sys.stdin if x.strip()]

          def version(name):
              return tuple(
                  map(int, name[len("ios_update_"):-len(".zip")].split("."))
              )

          files.sort(key=version)

          if files:
              print(files[-1])
          '
          )"

          if [ -z "$ASSET_NAME" ]; then
            echo "ios_update_*.zip が見つかりません。"
            exit 1
          fi

          echo "Download: $ASSET_NAME"

          gh release download ios-build-source \
            --repo omama2010/omama-tower-updates \
            --pattern "$ASSET_NAME" \
            --output iOS.zip

      - name: Extract
        run: |
          ditto -x -k iOS.zip ios_source
          
      - name: Fix executable permissions
        run: |
          ROOT=$(find ios_source -name "process_symbols.sh" -type f -exec dirname {} \; | head -1)
          chmod +x "$ROOT/process_symbols.sh"
          chmod +x "$ROOT/usymtool"
          chmod +x "$ROOT/usymtoolarm64"

      - name: Find Xcode project
        run: |
          PROJECT=$(find ios_source -name "Unity-iPhone.xcodeproj" -type d | head -1)
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Remove embedded static UnityRuntime
        run: |
          APP=$(find "$RUNNER_TEMP/build/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" -type d | head -1)

          echo "App: $APP"

          if [ -d "$APP/Frameworks/UnityRuntime.framework" ]; then
            rm -rf "$APP/Frameworks/UnityRuntime.framework"
            echo "Removed UnityRuntime.framework"
          fi

      - name: Create IPA
        run: |
          APP=$(find "$RUNNER_TEMP/build/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" -type d | head -1)

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/

          zip -qry OmamaTower-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OmamaTower-iOS
          path: OmamaTower-unsigned.ipa
